name: qada_tracker
description: A private, offline prayer journal and qada tracker.
publish_to: none
version: 1.12.0+13
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.0.3
  drift: 2.30.0
  sqlite3_flutter_libs: 0.5.41
  path_provider: 2.1.5
  path: 1.9.1
  file_picker: 10.3.7
  intl: 0.20.2
  http: 1.6.0
  geolocator: 14.0.2
  timezone: 0.10.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
